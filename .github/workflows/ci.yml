name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Three jobs in parallel, the Taskfile's checks: lint (tidiness, golangci-lint,
# the vulnerability scan), linux (the tests shuffled, with the race
# detector and on the oldest Go the library supports, then the examples)
# and windows (the tests and the build). Go comes from go.mod's toolchain
# line; its modules and builds are cached by setup-go, keyed by the three
# go.sum files.

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            _examples/go.sum
            tools/go.sum

      # Ebitengine's GLFW is built with cgo on Linux, against X11 and
      # OpenGL's headers; the linter type-checks it.
      - name: Install Ebitengine's system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libc6-dev libgl1-mesa-dev libxcursor-dev libxi-dev \
            libxinerama-dev libxrandr-dev libxxf86vm-dev libasound2-dev pkg-config

      - name: Check the go.mod files are tidy
        run: |
          go mod tidy
          (cd _examples && go mod tidy)
          (cd tools && go mod tidy)
          git diff --exit-code -- go.mod go.sum _examples/go.mod _examples/go.sum tools/go.mod tools/go.sum

      - name: Lint
        run: go tool -modfile=tools/go.mod golangci-lint run ./...

      - name: Vulnerability scan
        run: go tool -modfile=tools/go.mod govulncheck ./...

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            _examples/go.sum
            tools/go.sum

      # Xvfb and Mesa's software OpenGL give the tests a display and a GPU.
      - name: Install Ebitengine's system packages and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libc6-dev libgl1-mesa-dev libxcursor-dev libxi-dev \
            libxinerama-dev libxrandr-dev libxxf86vm-dev libasound2-dev pkg-config \
            xvfb libgl1-mesa-dri

      # Package globals (the input layers, the hovered flag) make tests
      # depend on their order when one leaves state behind: a random order
      # finds that.
      - name: Test in a random order
        run: xvfb-run -a go test -count=1 -shuffle=on ./...

      # Timers' callbacks run on other goroutines.
      - name: Test with the race detector
        run: xvfb-run -a go test -count=1 -race ./...

      # The library supports the Go go.mod's go line names; the toolchain
      # line is what work on it uses.
      - name: Test on the oldest Go supported
        run: |
          v=$(go list -m -f '{{.GoVersion}}')
          GOTOOLCHAIN=go$v xvfb-run -a go test -count=1 ./...

      - name: Vet and build the examples, for the desktop and the browser
        working-directory: _examples
        run: |
          go vet ./...
          go build ./...
          GOOS=js GOARCH=wasm go build ./...

  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            _examples/go.sum
            tools/go.sum

      - name: Build
        run: go build ./...

      # Windows runners have a desktop, so the tests draw as on a
      # developer's machine.
      - name: Test in a random order
        run: go test -count=1 -shuffle=on ./...
